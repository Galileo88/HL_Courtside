name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Check JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run unit tests
        run: node --test tests/*.test.cjs

      - name: Build site
        # Browsers keep cached scripts across deploys; a version query forces fresh code.
        run: |
          mkdir _site
          cp -r index.html css js assets _site/
          version="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"([A-Za-z0-9_./-]+\.(js|css))\"#\1=\"\2?v=${version}\"#g" _site/index.html
          grep -c "?v=${version}" _site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
