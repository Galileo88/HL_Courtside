name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done

      - name: Run unit tests
        run: node --test tests/*.test.cjs

      - name: Stamp asset versions
        # Browsers keep cached scripts across deploys; a version query forces fresh code.
        run: |
          version="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"([A-Za-z0-9_./-]+\.(js|css))\"#\1=\"\2?v=${version}\"#g" index.html
          grep -c "?v=${version}" index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
